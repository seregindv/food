<ng-template #dayContent let-day="day" let-preview="preview">
  @let items = meals.itemsForDay(day);
  <div class="values-list" [class.hidden]="!meals.hasMeals(day)">
    <div class="meals">
      @for (item of items; track item.index) {
        <div class="meal">
          <div class="meal-main">
            <input
              type="checkbox"
              name="meal"
              [attr.id]="preview ? null : 'meal' + (item.index + 1)"
              [attr.icon]="item.icon"
              [checked]="item.checked"
              (change)="meals.setEaten(item.index, $any($event.target).checked)"
            />
            <label class="meal-name" [attr.for]="preview ? null : 'meal' + (item.index + 1)">
              <div class="meal-name-primary">{{ item.primary }}</div>
              <div class="meal-name-secondary">{{ item.secondary }}</div>
              <div class="meal-weight" [class.hidden]="!item.info?.weight">
                {{ item.info?.weight }}
              </div>
            </label>
          </div>
          <div class="nutrition-grid meal-nutrition" [class.hidden]="!item.hasNutrition">
            @for (value of item.nutrition; track $index) {
              <div>{{ value }}</div>
            }
          </div>
        </div>
      }
    </div>
    <app-meal-actions
      [day]="day"
      [preview]="preview"
      [hasFoodInfo]="meals.hasFoodInfo(day)"
      (foodInfoOpen)="foodDialog.open()"
    />
  </div>
  @if (!preview) {
    <div id="noData" class="hidden"></div>
  }
</ng-template>
<div class="swipe-viewport">
  <div
    id="jsonDisplay"
    class="day-page"
    [style.transform]="'translateX(' + device.swipeOffset() + 'px)'"
    [style.opacity]="device.pageOpacity()"
    [style.transition]="device.swipeTransition()"
  >
    <ng-container
      [ngTemplateOutlet]="dayContent"
      [ngTemplateOutletContext]="{ day: meals.selectedDay(), preview: false }"
    />
  </div>
  @if (device.previewDay()) {
    <div
      class="day-preview"
      aria-hidden="true"
      [style.transform]="'translateX(' + device.previewOffset() + 'px)'"
      [style.opacity]="device.previewOpacity()"
      [style.transition]="device.swipeTransition()"
    >
      <ng-container
        [ngTemplateOutlet]="dayContent"
        [ngTemplateOutletContext]="{ day: device.previewDay(), preview: true }"
      />
    </div>
  }
</div>
<app-food-info-dialog #foodDialog [items]="foodItems()" />
