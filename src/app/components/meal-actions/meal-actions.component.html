<div class="meal-actions">
  <button
    type="button"
    id="shareEatIt"
    class="transparent-button glow"
    (click)="share()"
    aria-label="Поделиться"
  >
    ↗
  </button>
  <button
    type="button"
    id="copyEatIt"
    class="transparent-button glow"
    (click)="copy()"
    aria-label="Скопировать"
  >
    ▢
  </button>
</div>
